Metadata:
	Title: mod-title
	Description: mod-desc
	Version: {DEV_VERSION}
	WindowTitle: mod-windowtitle

ModCredits:
	ModTabTitle: Red Alert 2
	ModCreditsFile: ra2|CREDITS # TODO rename to AUTHORS as stated in the .cs files when OpenRA#17460 is available

PackageFormats: Mix, AudioBag

FileSystem: ContentInstallerFileSystem
	SystemPackages:
		^EngineDir
		$ra2: ra2
		~^SupportDir|Content/ra2: content
		^EngineDir|mods/common: common
		ra2|uibits
	ContentPackages:
		~ra2.mix
		~language.mix
		~multi.mix
		~audio.mix
		~cache.mix
		~cameo.mix
		~conquer.mix: conquer
		~generic.mix
		~isogen.mix
		~isosnow.mix
		~isotemp.mix
		~isourb.mix
		~load.mix
		~local.mix
		~neutral.mix
		~sidec01.mix
		~sidec02.mix
		~sno.mix
		~snow.mix
		~tem.mix
		~temperat.mix
		~theme.mix
		~urb.mix
		~urban.mix
		~audio.bag
		ra2|bits
		ra2|bits/cameos
		ra2|bits/structures
		ra2|bits/animations
		ra2|bits/projectiles
		ra2|uibits
    ContentInstallerMod: ra2-content

MapFolders:
	ra2|maps: System
	~^maps/ra2/{DEV_VERSION}: User

ModelSequences:
	ra2|sequences/voxels.yaml

Assemblies: OpenRA.Mods.Common.dll, OpenRA.Mods.Cnc.dll, OpenRA.Mods.RA2.dll

MapGrid:
	Type: RectangularIsometric
	EnableDepthBuffer: true
	SubCellsOffsets: 0,0,0, -256,128,0, 0,-128,0, 256,128,0
#	SubCellOffsets: 0,0,0, -362,0,0, 0,362,0, 362,0,0
	DefaultSubCell: 2
	MaximumTerrainHeight: 16

LoadScreen: LogoStripeLoadScreen
	Image: ra2|uibits/loadscreen.png
	Text: loadscreen-loading

ServerTraits:
	LobbyCommands
	PlayerPinger
	MasterServerPinger
	LobbySettingsNotification

DefaultOrderGenerator: UnitOrderGenerator

SupportsMapsFrom: ra2

SoundFormats: Aud, Wav

SpriteFormats: ShpTS, TmpTS, ShpTD, PngSheet

VideoFormats: Vqa

TerrainFormat: DefaultTerrain

SpriteSequenceFormat: TilesetSpecificSpriteSequence
	TilesetExtensions:
		TEMPERATE: .tem
		SNOW: .sno
		URBAN: .urb
	TilesetCodes:
		GENERIC: g
		SNOW: a
		TEMPERATE: t
		URBAN: u
	TilesetSuffixes:
		SNOW: a

AssetBrowser:
	SpriteExtensions: .shp, .tem, .urb, .sno
	ModelExtensions: .vxl
	AudioExtensions: .aud, .wav
	VideoExtensions: .vqa

GameSpeeds:
	DefaultSpeed: default
	Speeds:
		slowest:
			Name: options-game-speed.slowest
			Timestep: 80
			OrderLatency: 2
		slower:
			Name: options-game-speed.slower
			Timestep: 50
			OrderLatency: 3
		default:
			Name: options-game-speed.normal
			Timestep: 40
			OrderLatency: 3
		fast:
			Name: options-game-speed.fast
			Timestep: 35
			OrderLatency: 4
		faster:
			Name: options-game-speed.faster
			Timestep: 30
			OrderLatency: 4
		fastest:
			Name: options-game-speed.fastest
			Timestep: 20
			OrderLatency: 6


Include: mod.content.yaml
Include: mod.chrome.yaml
